services:
  - type: web
    name: furzy-api
    runtime: python
    # Render Free: the service sleeps after inactivity and the local
    # filesystem is ephemeral. Uploaded images are stored in PostgreSQL.
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: 'uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"'
    healthCheckPath: /health/ready
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.16"
      - key: APP_ENV
        value: production
      # Neon pooled URL, for example:
      # postgresql+psycopg://USER:PASSWORD@HOST-pooler.REGION.aws.neon.tech/DB?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Exact Vercel production origin, for example:
      # https://your-project.vercel.app (no trailing slash)
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      # Render service URL, for example https://furzy-api.onrender.com
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: UPLOADS_DIR
        value: /tmp/furzy-uploads
      - key: SHIPPING_FEE_LKR
        value: "350"
      - key: RETURN_WINDOW_DAYS
        value: "30"
      - key: ONLINE_PAYMENT_RESERVATION_MINUTES
        value: "30"
      - key: STOCK_RESERVATION_SWEEP_ENABLED
        value: "true"
      - key: STOCK_RESERVATION_SWEEP_SECONDS
        value: "60"
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "false"
      - key: REVIEW_MODERATION_ENABLED
        value: "false"
      - key: ADMIN_EMAIL_ALERTS_ENABLED
        value: "false"
      - key: ADMIN_ALERT_EMAILS
        value: ""
      - key: PAYMENT_PROVIDER
        value: payhere
      - key: PAYMENT_CURRENCY
        value: LKR
      - key: PAYMENT_MOCK_ENABLED
        value: "false"
      # Sandbox only. Never change this to false for the free demo.
      # Add PAYHERE_MERCHANT_ID / PAYHERE_MERCHANT_SECRET (and optional
      # PAYHERE_API_APP_ID / PAYHERE_API_APP_SECRET) in the Render
      # dashboard when sandbox credentials are available.
      - key: PAYHERE_SANDBOX
        value: "true"
      - key: PAYHERE_API_TIMEOUT_SECONDS
        value: "10"
