name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: End-to-end purchase journey
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///${{ github.workspace }}/backend/e2e.db
      UPLOADS_DIR: ${{ github.workspace }}/backend/e2e-uploads
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      ADMIN_NAME: CI Admin
      ADMIN_EMAIL: admin@furzy.dev
      ADMIN_PASSWORD: E2EAdminPass123!
      APP_ENV: test
      FRONTEND_ORIGINS: http://127.0.0.1:5173
      FRONTEND_BASE_URL: http://127.0.0.1:5173
      BACKEND_PUBLIC_URL: http://127.0.0.1:8005
      PAYMENT_PROVIDER: mock
      PAYMENT_MOCK_ENABLED: "true"
      PAYMENT_CURRENCY: LKR
      ONLINE_PAYMENT_RESERVATION_MINUTES: "30"
      STOCK_RESERVATION_SWEEP_ENABLED: "false"
      E2E_ADMIN_EMAIL: admin@furzy.dev
      E2E_ADMIN_PASSWORD: E2EAdminPass123!
      E2E_API_URL: http://127.0.0.1:8005
      E2E_BASE_URL: http://127.0.0.1:5173
      E2E_DISPOSABLE_DB: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare disposable database
        working-directory: backend
        run: |
          mkdir -p uploads "$UPLOADS_DIR"
          python -m alembic upgrade head
          python -m app.seed
          python -m app.seed_admin

      - name: Start backend
        working-directory: backend
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8005 > /tmp/backend.log 2>&1 &
          curl -sS --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8005/health/ready

      - name: Run API smoke checks
        working-directory: backend
        run: python -m app.smoke_test --base-url http://127.0.0.1:8005

      - name: Start frontend
        working-directory: frontend
        run: |
          VITE_API_URL=http://127.0.0.1:8005 nohup npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/frontend.log 2>&1 &
          curl -sS --retry 20 --retry-delay 1 --retry-connrefused -o /dev/null http://127.0.0.1:5173/

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run purchase journey
        working-directory: frontend
        run: npx playwright test

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "--- backend ---"
          cat /tmp/backend.log || true
          echo "--- frontend ---"
          cat /tmp/frontend.log || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
